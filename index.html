<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f0b0b">
<title>EduApp</title>
<style>
:root{--bg:#f6f4f4;--card:#fff;--ink:#1c1f2a;--mute:#6b7280;--acc:#dc2626;--line:#e8e2e2;--red:#e11919;--red-d:#8f0b0b;--pink:#ffdfe0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b24;--ink:#eceef4;--mute:#9aa0b0;--line:#262a36}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
button{padding:12px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--line)}
.mute{color:var(--mute)}

/* ---------- app screens ---------- */
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:20px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card.warn{border-color:#f59e0b}
.tabs,.chips{display:flex;gap:8px;margin-bottom:12px}
.tabs button,.chips button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line)}
.tabs button.on,.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips button{padding:12px 4px;white-space:nowrap;font-size:15px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--line);white-space:nowrap}
.badge.free{background:#d1fae5;color:#065f46}
h2.grp{font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.note p{margin:0 0 8px}
.note h3{margin:16px 0 6px}
.note li{margin-left:20px;display:list-item}
a.btn{display:block;text-align:center;text-decoration:none;padding:12px 16px;border-radius:10px;background:var(--acc);color:#fff;font-weight:600;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90%}

/* ---------- welcome / sign in / sign up (same look in light and dark) ---------- */
.pill{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:0;border-radius:16px;background:var(--red);color:#fff;font:inherit;font-size:18px;font-weight:700}
.pill:disabled{opacity:.6}
.pill.on-dark{background:#ff1a1a;border:2px solid #ffb3b3}
.pill.light{background:#fff;color:var(--red)}

.welcome{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;overflow:hidden;background:var(--red-d);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 32px calc(120px + env(safe-area-inset-bottom))}
.welcome svg{position:absolute;inset:0;width:100%;height:100%}
.welcome .inner{position:relative;z-index:1;text-align:center}
.welcome h1{font-size:34px;line-height:1.15;font-weight:800;margin:0 0 10px}
.welcome p{opacity:.95;margin:0 0 28px;font-size:16px}
.welcome .pill{max-width:260px;margin:0 auto 14px}

.auth{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--pink);overflow:hidden;display:flex;flex-direction:column;color:#1c1f2a}
.hero{position:relative;height:34vh;min-height:200px;flex:none}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.back{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:var(--red-d);font-size:20px;padding:0;z-index:2}
.sheet{position:relative;flex:1;background:#fff;border-radius:34px 34px 0 0;margin-top:-30px;padding:28px 24px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(143,11,11,.12)}
.sheet h1{text-align:center;color:var(--red);font-size:30px;font-weight:800;margin:0 0 24px}
.fl{position:relative;display:block;margin-bottom:20px}
.fl>span{position:absolute;left:16px;top:-9px;background:#fff;padding:0 6px;font-size:13px;color:#333;z-index:1}
.fl input{width:100%;padding:15px 16px;border:1.5px solid #cfcfcf;border-radius:14px;background:#fff;color:#111;font:inherit;font-size:16px}
.fl input:focus{outline:none;border-color:var(--red)}
.fl input::placeholder{color:#9a9a9a}
.fl .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--red);padding:8px 10px;font-size:14px;font-weight:700}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:#444;margin:2px 0 22px}
.agree input{width:20px;height:20px;accent-color:var(--red);margin:1px 0 0;flex:none}
.swap{text-align:center;color:#777;font-size:14px;margin:20px 0 0}
.swap a{color:var(--red);font-weight:700;text-decoration:none}
.note-msg{background:#fff4e5;border:1px solid #f59e0b;border-radius:12px;padding:10px 12px;margin-bottom:18px;font-size:14px;color:#7a4a00}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== EDIT THESE 3 LINES ======
const SUPABASE_URL = "https://gqjtxnktvbnznhdvsdgo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_UrZKra0iGRdrA2aCSoyKbQ_Zf9QxRjA";
const CONTACT_TEXT = "To unlock everything, contact the admin on Telegram: @your_username";
// =================================
const APP_NAME = "EduApp";

const $app = document.getElementById('app');
const state = { deviceId: null, items: [], tab: 'notes', grade: 9 };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if (typeof supabase === 'undefined' || SUPABASE_URL.indexOf('PASTE_') === 0) {
  $app.innerHTML = '<div class="wrap"><div class="card warn">Setup needed: put your Supabase URL and anon key at the top of this file (see SETUP.md). If you did, check your internet connection.</div></div>';
  throw new Error('Not configured');
}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

// ---------- Device ID ----------
// In the real APK (Capacitor + @capacitor/device) this is the Android device ID.
// In a plain browser it is a random ID saved in the browser.
async function getDeviceId() {
  try {
    const dev = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Device;
    if (dev && dev.getId) {
      const r = await dev.getId();
      if (r && r.identifier) return 'cap-' + r.identifier;
    }
  } catch (e) {}
  let id = null;
  try { id = localStorage.getItem('edu_device_id'); } catch (e) {}
  if (!id) {
    id = 'web-' + (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
    try { localStorage.setItem('edu_device_id', id); } catch (e) {}
  }
  return id;
}

// ---------- Artwork (original shapes, red palette) ----------
function welcomeArt() {
  return `<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <radialGradient id="gs" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ff6a6a"/><stop offset="1" stop-color="#5a0505"/></radialGradient>
      <radialGradient id="gg" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></radialGradient>
    </defs>
    <rect width="400" height="800" fill="#8f0b0b"/>
    <path d="M400 0V470C330 520 250 470 215 390C175 300 245 240 300 190C345 150 330 70 270 0Z" fill="#ff3b3b"/>
    <path d="M-10 110C60 70 150 120 175 215C200 310 130 400 60 430C20 448-10 440-10 440Z" fill="#b30f0f"/>
    <circle cx="55" cy="75" r="52" fill="url(#gs)"/>
    <circle cx="292" cy="215" r="48" fill="url(#gg)"/>
    <circle cx="62" cy="775" r="40" fill="#e11919"/>
    <circle cx="300" cy="795" r="72" fill="url(#gs)" opacity=".92"/>
  </svg>`;
}
function heroArt() {
  return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <radialGradient id="hs" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ff6a6a"/><stop offset="1" stop-color="#5a0505"/></radialGradient>
      <radialGradient id="hg" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity=".15"/></radialGradient>
    </defs>
    <rect width="400" height="300" fill="#ffdfe0"/>
    <path d="M400 0V300H175C130 255 160 200 215 165C275 125 250 55 300 0Z" fill="#ff3b3b"/>
    <path d="M-10 70C60 40 135 80 150 170C162 245 120 300 120 300H-10Z" fill="#a50d0d"/>
    <circle cx="135" cy="62" r="40" fill="url(#hs)"/>
    <circle cx="285" cy="120" r="40" fill="url(#hg)"/>
  </svg>`;
}

// ---------- Welcome / Auth ----------
function viewWelcome() {
  $app.innerHTML = `<div class="welcome">${welcomeArt()}
    <div class="inner">
      <h1>Welcome to ${esc(APP_NAME)}</h1>
      <p>Short notes and past EUEE exams for grade 9-12.</p>
      <button class="pill on-dark" onclick="viewAuth('login')">Sign in <span>&rarr;</span></button>
      <button class="pill light" onclick="viewAuth('signup')">Sign up <span>&rarr;</span></button>
    </div></div>`;
}

function viewAuth(mode, msg) {
  mode = mode === 'signup' ? 'signup' : 'login';
  const su = mode === 'signup';
  $app.innerHTML = `<div class="auth">
    <div class="hero">${heroArt()}<button type="button" class="back" aria-label="Back" onclick="viewWelcome()">&larr;</button></div>
    <form class="sheet" onsubmit="submitAuth('${mode}');return false" novalidate>
      <h1>${su ? 'Get Started' : 'Welcome Back'}</h1>
      ${msg ? `<div class="note-msg">${esc(msg)}</div>` : ''}
      ${su ? '<label class="fl"><span>Full name</span><input id="nm" type="text" placeholder="Enter full name" autocomplete="name"></label>' : ''}
      <label class="fl"><span>Email</span><input id="em" type="email" placeholder="Enter email" autocomplete="username" inputmode="email"></label>
      <label class="fl"><span>Password</span><input id="pw" type="password" placeholder="${su ? 'Create password' : 'Enter password'}" autocomplete="${su ? 'new-password' : 'current-password'}"><button type="button" class="eye" onclick="togglePw(this)">Show</button></label>
      ${su ? '<label class="agree"><input id="ag" type="checkbox"><span>I agree to the processing of my personal data</span></label>' : ''}
      <button id="go" class="pill" type="submit">${su ? 'Sign up' : 'Sign in'} <span>&rarr;</span></button>
      <p class="swap">${su ? 'Already have an account?' : "Don't have an account?"} <a href="#" onclick="viewAuth('${su ? 'login' : 'signup'}');return false">${su ? 'Sign in' : 'Sign up'}</a></p>
      <p class="swap" style="margin-top:8px;font-size:13px">One account works on one device only.</p>
    </form></div>`;
}

function togglePw(b) {
  const i = document.getElementById('pw');
  const show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  b.textContent = show ? 'Hide' : 'Show';
}

async function submitAuth(mode) {
  const email = document.getElementById('em').value.trim();
  const password = document.getElementById('pw').value;
  const nameEl = document.getElementById('nm');
  const name = nameEl ? nameEl.value.trim() : '';
  if (mode === 'signup') {
    if (!name) return toast('Please enter your full name');
    if (!document.getElementById('ag').checked) return toast('Please tick the agreement to continue');
  }
  if (!email || password.length < 6) return toast('Enter your email and a password of 6+ characters');
  const btn = document.getElementById('go');
  btn.disabled = true;
  const res = mode === 'login'
    ? await sb.auth.signInWithPassword({ email, password })
    : await sb.auth.signUp({ email, password, options: { data: { full_name: name } } });
  btn.disabled = false;
  if (res.error) return toast(res.error.message);
  if (!res.data.session) return viewAuth('login', 'Account created. Confirm your email, then sign in.');
  afterLogin();
}

async function logout() {
  await sb.auth.signOut();
  state.items = [];
  viewWelcome();
}

async function handleErr(error) {
  const m = (error && error.message) || 'Something went wrong';
  if (m.indexOf('wrong_device') >= 0) {
    await sb.auth.signOut();
    return viewAuth('login', 'This account is linked to another device. Contact the admin if you changed phones.');
  }
  if (m.indexOf('locked') >= 0) return toast('This item is locked');
  toast(m);
}

async function afterLogin() {
  state.deviceId = await getDeviceId();
  const { data, error } = await sb.rpc('bind_device', { p_device_id: state.deviceId });
  if (error) return handleErr(error);
  if (data === 'wrong_device') return handleErr({ message: 'wrong_device' });
  await loadIndex();
}

// ---------- Content ----------
async function loadIndex() {
  const { data, error } = await sb.rpc('list_content', { p_device_id: state.deviceId });
  if (error) return handleErr(error);
  state.items = data || [];
  viewHome();
}

function setTab(t) { state.tab = t; viewHome(); }
function setGrade(g) { state.grade = g; viewHome(); }

function viewHome() {
  const notes = state.tab === 'notes';
  let list = state.items.filter(i => notes ? (i.kind === 'note' && i.grade === state.grade) : i.kind === 'exam');
  if (!notes) list = list.slice().sort((a, b) => (b.year || 0) - (a.year || 0) || String(a.subject).localeCompare(String(b.subject)));

  const groups = {}, order = [];
  list.forEach(i => {
    const g = notes ? i.subject : (i.year ? 'EUEE ' + i.year : 'EUEE');
    if (!groups[g]) { groups[g] = []; order.push(g); }
    groups[g].push(i);
  });

  const rows = order.map(g => `<h2 class="grp">${esc(g)}</h2>` + groups[g].map(i => `
    <div class="card item" onclick="openItem('${esc(i.id)}')">
      <div><b>${esc(i.title)}</b>${notes ? '' : `<div class="mute" style="font-size:14px">${esc(i.subject)}</div>`}</div>
      ${i.locked ? '<span class="badge">&#128274; Locked</span>' : (i.is_free ? '<span class="badge free">FREE</span>' : '')}
    </div>`).join('')).join('');

  $app.innerHTML = `<div class="wrap">
    <header><h1>${esc(APP_NAME)}</h1><button class="ghost" onclick="logout()">Log out</button></header>
    <div class="tabs">
      <button class="${notes ? 'on' : ''}" onclick="setTab('notes')">Notes</button>
      <button class="${notes ? '' : 'on'}" onclick="setTab('exams')">Past EUEE</button>
    </div>
    ${notes ? `<div class="chips">${[9, 10, 11, 12].map(g => `<button class="${state.grade === g ? 'on' : ''}" onclick="setGrade(${g})">Grade ${g}</button>`).join('')}</div>` : ''}
    ${rows || '<p class="mute" style="text-align:center;margin-top:40px">Nothing here yet. New material is added regularly.</p>'}
  </div>`;
}

function viewLocked(it) {
  $app.innerHTML = `<div class="wrap">
    <header><button class="ghost" onclick="viewHome()">&larr; Back</button></header>
    <div class="card"><h1>&#128274; ${esc(it.title)}</h1>
      <p>This item is part of the full version.</p>
      <p><b>${esc(CONTACT_TEXT)}</b></p>
      <p class="mute">After you pay, the admin activates your account. Free items are open to everyone.</p>
    </div></div>`;
}

async function openItem(id) {
  const it = state.items.find(x => x.id === id);
  if (!it) return;
  if (it.locked) return viewLocked(it);
  const { data, error } = await sb.rpc('get_content', { p_id: id, p_device_id: state.deviceId });
  if (error) return handleErr(error);
  const row = Array.isArray(data) ? data[0] : data;
  if (!row) return toast('Not found');
  let url = null;
  if (row.file_path) {
    const s = await sb.storage.from('materials').createSignedUrl(row.file_path, 3600);
    if (s.error) toast('Could not load the PDF'); else url = s.data.signedUrl;
  }
  viewReader(row, url);
}

// tiny formatter: "# heading", "- bullet", **bold**
function fmt(t) {
  return esc(t).split('\n').map(l => {
    if (/^#{1,3} /.test(l)) return '<h3>' + l.replace(/^#{1,3} /, '') + '</h3>';
    if (/^[-*] /.test(l)) return '<li>' + l.slice(2) + '</li>';
    if (!l.trim()) return '<br>';
    return '<p>' + l + '</p>';
  }).join('').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}

function viewReader(row, url) {
  $app.innerHTML = `<div class="wrap">
    <header><button class="ghost" onclick="viewHome()">&larr; Back</button></header>
    <h1 style="margin-bottom:12px">${esc(row.title)}</h1>
    ${url ? `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open PDF</a>` : ''}
    ${row.body ? `<div class="card note">${fmt(row.body)}</div>` : ''}
  </div>`;
  window.scrollTo(0, 0);
}

// ---------- Start ----------
(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) afterLogin(); else viewWelcome();
})();
</script>
</body>
</html>
